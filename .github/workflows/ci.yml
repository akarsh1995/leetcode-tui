name: CI & Release

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test & Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo cache
        uses: actions/cache@v4
        env:
          cache-name: ci
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ matrix.os }}-${{ env.cache-name }}-${{ hashFiles('Cargo.lock') }}

      - name: MacOS Workaround
        if: matrix.os == 'macos-latest'
        run: cargo clean -p serde_derive -p thiserror

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Build Debug
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --workspace --all-features

      - name: Build Release
        run: cargo build --release

      - name: Test Install
        run: cargo install --path leetcode-tui-rs --force

      - name: Binary Size (unix)
        if: matrix.os != 'windows-latest'
        run: ls -lh ./target/release/leetui

      - name: Binary Size (win)
        if: matrix.os == 'windows-latest'
        run: ls -lh ./target/release/leetui.exe

      - name: Binary dependencies (mac)
        if: runner.os == 'macOS'
        run: otool -L ./target/release/leetui

  linting:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt -- --check

  check-release:
    name: Check Release Eligibility
    needs: [build, linting]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if release should run
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "Triggered by tag $TAG (version $VERSION)"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v$VERSION"
            echo "Cargo version is $VERSION (tag $TAG)"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists on GitHub. Skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG does not exist on GitHub. Proceeding with release."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"

              if ! git rev-parse "$TAG" >/dev/null 2>&1; then
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git tag -a "$TAG" -m "Release $TAG"
                git push origin "$TAG" || true
              fi
            fi
          fi

  build-release:
    name: Build Release Binary (${{ matrix.target }})
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: leetui
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: leetui
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: leetui
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: leetui.exe
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          TAG="${{ needs.check-release.outputs.tag_name }}"
          ARCHIVE="leetui-${TAG}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} .
          tar -czf "$ARCHIVE" ${{ matrix.binary_name }} README.md LICENSE
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          TAG="${{ needs.check-release.outputs.tag_name }}"
          ARCHIVE="leetui-${TAG}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} .
          7z a "$ARCHIVE" ${{ matrix.binary_name }} README.md LICENSE
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            leetui-${{ needs.check-release.outputs.tag_name }}-${{ matrix.target }}.*
          retention-days: 1

  create-release:
    name: Publish GitHub Release
    needs: [check-release, build-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes
        id: release_notes
        uses: ffurrer2/extract-release-notes@v2
        continue-on-error: true

      - name: Download all built assets
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag_name }}
          name: ${{ needs.check-release.outputs.tag_name }}
          body: ${{ steps.release_notes.outputs.release_notes }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to Crates.io
    needs: [check-release, create-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in topological dependency order
        shell: bash
        run: |
          crates=(
            "leetcode-tui-shared"
            "leetcode-core"
            "leetcode-tui-config"
            "leetcode-tui-db"
            "leetcode-tui-core"
            "leetcode-tui-rs"
          )

          for crate in "${crates[@]}"; do
            echo "::group::Publishing $crate"
            cargo publish -p "$crate" --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" || echo "Warning: $crate publish failed or was already published"
            echo "Waiting 20 seconds for crates.io index to update..."
            sleep 20
            echo "::endgroup::"
          done
